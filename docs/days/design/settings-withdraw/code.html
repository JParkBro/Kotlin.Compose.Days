  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(210,60,105,0.04)]"><div class="h-14 px-margin-mobile flex items-center justify-between"><div class="flex items-center gap-space-xs"><button class="min-w-[44px] min-h-[44px] flex items-center justify-center text-on-surface hover:text-primary transition-colors -ml-space-xs" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-bold">커플 프로필 관리</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex flex-col relative w-full pt-14 pb-safe px-margin-mobile bg-surface"><div class="flex flex-col w-full pb-8">
<div class="flex flex-col items-center text-center mt-4 mb-6 px-margin-mobile">
<div class="relative w-24 h-24 rounded-full bg-error-container flex items-center justify-center mb-5 shadow-sm">
<div class="w-16 h-16 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-inner">
<span class="material-symbols-outlined text-[34px] text-error" style="font-variation-settings: 'FILL' 1;">heart_broken</span>
</div>
<div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-error flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-error text-[18px]">warning</span>
</div>
</div>
<h2 class="font-headline-md text-headline-md text-primary mb-2 tracking-tight">정말 탈퇴할까요?</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
      탈퇴하시면 모든 소중한 기록이 영구적으로 사라집니다.
    </p>
</div>
<div class="px-margin-mobile flex flex-col gap-space-lg">
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm">
<div class="flex items-center justify-between mb-3 px-1">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">계정 연동 데이터 현황</span>
<span class="font-label-sm text-label-sm text-primary font-bold">D+428일째</span>
</div>
<div class="grid grid-cols-3 gap-space-xs text-center">
<div class="bg-surface-container-low rounded-lg py-space-sm px-1">
<p class="font-headline-sm text-headline-sm text-primary mb-0.5">142</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">추억 사진</p>
</div>
<div class="bg-surface-container-low rounded-lg py-space-sm px-1">
<p class="font-headline-sm text-headline-sm text-primary mb-0.5">38</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">등록된 기념일</p>
</div>
<div class="bg-surface-container-low rounded-lg py-space-sm px-1">
<p class="font-headline-sm text-headline-sm text-primary mb-0.5">12</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">데이트 버킷</p>
</div>
</div>
</div>
<div class="bg-error-container/40 rounded-xl p-space-lg shadow-sm">
<div class="flex items-center gap-space-xs text-error mb-3.5">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">error</span>
<span class="font-label-lg text-label-lg font-bold">탈퇴 시 유의사항</span>
</div>
<div class="flex flex-col gap-space-md">
<div class="flex items-start gap-space-sm">
<span class="w-1.5 h-1.5 rounded-full bg-error mt-2 shrink-0"></span>
<p class="font-body-md text-body-md text-on-surface">
            모든 디데이와 일정이 삭제돼요
          </p>
</div>
<div class="flex items-start gap-space-sm">
<span class="w-1.5 h-1.5 rounded-full bg-error mt-2 shrink-0"></span>
<p class="font-body-md text-body-md text-on-surface">
            커플 연결도 해제돼요
          </p>
</div>
<div class="flex items-start gap-space-sm">
<span class="w-1.5 h-1.5 rounded-full bg-error mt-2 shrink-0"></span>
<p class="font-body-md text-body-md text-on-surface">
            삭제된 데이터는 복구할 수 없어요
          </p>
</div>
</div>
</div>
<div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm">
<label class="flex items-center gap-space-sm cursor-pointer select-none" id="consent-container">
<input class="sr-only" id="delete-consent" type="checkbox"/>
<div class="w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center transition-all duration-200 shrink-0" id="custom-checkbox">
<span class="material-symbols-outlined text-[16px] text-surface-container-lowest opacity-0 transition-opacity duration-200 font-bold" id="check-icon">check</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface select-none">안내를 확인했어요</span>
</label>
</div>
<div class="flex flex-col gap-space-sm pt-2">
<button class="w-full h-12 rounded-full bg-error/40 text-on-error font-label-lg text-label-lg flex items-center justify-center gap-space-xs transition-all duration-200 cursor-not-allowed shadow-none active:scale-[0.98]" disabled="" id="btn-delete" type="button">
<span class="material-symbols-outlined text-[20px]">heart_minus</span>
<span>탈퇴하기</span>
</button>
<button class="w-full h-12 rounded-full bg-surface-container-high text-on-surface font-label-lg text-label-lg flex items-center justify-center transition-colors active:scale-[0.98]" onclick="history.back()" type="button">
<span>취소</span>
</button>
</div>
</div>
<script>
    (function() {
      const checkbox = document.getElementById('delete-consent');
      const boxGraphic = document.getElementById('custom-checkbox');
      const checkIcon = document.getElementById('check-icon');
      const deleteBtn = document.getElementById('btn-delete');

      checkbox.addEventListener('change', function() {
        if (this.checked) {
          boxGraphic.classList.remove('bg-surface-container-high');
          boxGraphic.classList.add('bg-error');
          checkIcon.classList.remove('opacity-0');
          checkIcon.classList.add('opacity-100');

          deleteBtn.disabled = false;
          deleteBtn.classList.remove('bg-error/40', 'cursor-not-allowed');
          deleteBtn.classList.add('bg-error', 'shadow-md', 'hover:opacity-95');
        } else {
          boxGraphic.classList.remove('bg-error');
          boxGraphic.classList.add('bg-surface-container-high');
          checkIcon.classList.remove('opacity-100');
          checkIcon.classList.add('opacity-0');

          deleteBtn.disabled = true;
          deleteBtn.classList.add('bg-error/40', 'cursor-not-allowed');
          deleteBtn.classList.remove('bg-error', 'shadow-md', 'hover:opacity-95');
        }
      });

      deleteBtn.addEventListener('click', function() {
        if (!this.disabled) {
          if (confirm('모든 데이터가 영구적으로 파기됩니다. 정말로 탈퇴하시겠습니까?')) {
            alert('회원 탈퇴 처리가 완료되었습니다.');
            history.back();
          }
        }
      });
    })();
  </script>
</div></main></body></html>
