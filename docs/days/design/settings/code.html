  (function initSettingsInteractions() {
    const toggle = document.getElementById('toggleNotifications');
    const thumb = document.getElementById('toggleThumb');
    if (!toggle || !thumb) return;

    let isEnabled = true;

    toggle.addEventListener('click', () => {
      isEnabled = !isEnabled;
      toggle.setAttribute('aria-checked', isEnabled.toString());
      if (isEnabled) {
        toggle.classList.remove('bg-surface-variant');
        toggle.classList.add('bg-primary');
        thumb.classList.remove('translate-x-0.5');
        thumb.classList.add('translate-x-5');
      } else {
        toggle.classList.remove('bg-primary');
        toggle.classList.add('bg-surface-variant');
        thumb.classList.remove('translate-x-5');
        thumb.classList.add('translate-x-0.5');
      }
    });
  })();
