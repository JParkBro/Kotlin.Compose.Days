  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(210,60,105,0.04)] pt-safe"><div class="h-14 px-margin-mobile flex items-center justify-between"><button aria-label="뒤로 가기" class="min-w-[44px] min-h-[44px] -ml-space-xs flex items-center gap-space-xs text-on-surface hover:text-primary transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span><span class="font-label-lg text-label-lg">뒤로</span></button><h1 class="absolute left-1/2 -translate-x-1/2 font-headline-sm text-headline-sm text-on-surface text-center pointer-events-none truncate max-w-[200px]">커플 연결</h1><div class="min-w-[44px] min-h-[44px] flex items-center justify-end"></div></div></header><main class="flex flex-col relative w-full pt-14 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full px-margin-mobile pb-space-2xl">
<!-- Visual Center: Overlapping Avatars & Heart Interlink -->
<div class="flex flex-col items-center pt-space-lg pb-space-md">
<div class="relative flex items-center justify-center mb-space-lg">
<!-- Left Avatar (User) -->
<div class="relative w-20 h-20 rounded-full bg-surface-container-lowest shadow-md overflow-hidden z-10">
<img class="w-full h-full object-cover" data-alt="Warm intimate Korean couple male portrait, gentle smile, natural soft daylight, aesthetic film tone in warm pastel pink studio lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWkITXOZXuQZ2jNnzrL8G2M6YGRACVuObTvHzN9r6UuaDIn6l3yKSVVGbT9bqYfsu-haNztXT5Qohukgx4osBh707dr5ods71nIONzo4UzoYRvVGcOYeMrTcmxjOua5VrQUhEqZHzGgkFAerLqLacqwrpi5YZ8V5B2y17Q1eRuDBWiHgCINIeWo18QWtp25zJRCk5_K61waZrw_W9svL2917PLkjmxJwsNBYF5ECw"/>
</div>
<!-- Connecting Heart Badge -->
<div class="absolute z-20 flex items-center justify-center w-9 h-9 rounded-full bg-primary-container text-on-primary shadow-md">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<!-- Right Avatar (지민) -->
<div class="relative w-20 h-20 rounded-full bg-surface-container-lowest shadow-md overflow-hidden z-0 -ml-4">
<img class="w-full h-full object-cover" data-alt="Sweet radiant portrait of a smiling young Korean woman with soft bob hair, warm golden natural light, warm blush aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOzHOVgvx1LmufBMZ-FhD4YcuXQ8zx4FIw93UqVQP6cwXUsCD83j6TAgcKCfD4nbj92PSX2IhNh-RRCpvX32yYeF6lqTnksEWKiSMG0-XqBnQBmxwQFaO20A6qjfNnz7WyVQHam2TvVhPhuMo-T_hc8tJssKReKkv397899wqBGW0-V6s2mprAbpZRJG0WT4_QTX-QF3LMN3-RSMvXDa1ocxdBZ0KrSM-qqD6NEcI"/>
</div>
</div>
<!-- Title & Subtitle -->
<h2 class="font-headline-md text-headline-md text-on-surface text-center mb-space-xs">
      지민 님과 연결할까요?
    </h2>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center">
      코드가 확인되었어요. 두 분의 시작일을 확인해 주세요.
    </p>
</div>
<!-- Anniversary Configuration Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_-4px_rgba(210,60,105,0.06)] p-space-lg flex flex-col gap-space-lg mb-space-md">
<!-- Row 1: Start Date Row -->
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant mb-space-xs">우리가 사귄 날</span>
<span class="font-metric-tabular text-metric-tabular text-on-surface tracking-tight" id="anniversary-date-display">2025년 6월 14일</span>
</div>
<button aria-label="사귄 날 변경" class="flex items-center gap-space-xs px-space-md py-space-xs rounded-full bg-surface-container text-primary active:scale-95 transition-all" id="btn-edit-date" type="button">
<span class="font-label-md text-label-md text-primary font-semibold">변경</span>
<span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</div>
<!-- Soft Tonal Divider -->
<div class="w-full h-[1px] bg-surface-container-highest"></div>
<!-- Row 2: Day 1 Toggle -->
<div class="flex items-center justify-between gap-space-md">
<div class="flex flex-col min-w-0 pr-space-xs">
<span class="font-label-lg text-label-lg text-on-surface">사귄 날을 1일로 세기</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">사귄 날을 0일이 아닌 1일로 세요</span>
</div>
<!-- iOS style Toggle Switch -->
<button aria-checked="true" class="relative inline-flex h-7 w-12 flex-shrink-0 cursor-pointer rounded-full p-0.5 bg-primary-container transition-colors duration-200 ease-in-out focus:outline-none" id="toggle-day-one" role="switch" type="button">
<span class="pointer-events-none inline-block h-6 w-6 transform rounded-full bg-surface shadow-md transition duration-200 ease-in-out translate-x-5" id="toggle-thumb"></span>
</button>
</div>
</div>
<!-- Preview Highlight Pill Note -->
<div class="w-full bg-surface-container-low rounded-xl px-space-lg py-space-md flex items-center justify-center gap-space-sm mb-space-xl">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<p class="font-label-md text-label-md text-primary text-center">
      오늘로 함께한 지 <span class="font-metric-tabular font-bold" id="days-count">510</span>일째 되는 날이에요
    </p>
</div>
<!-- Bottom Interactive Buttons -->
<div class="flex flex-col gap-space-sm w-full">
<!-- Primary CTA -->
<button class="w-full h-[52px] bg-primary-container text-on-primary-container font-label-lg text-label-lg font-bold rounded-xl flex items-center justify-center shadow-[0_6px_18px_rgba(210,60,105,0.22)] active:scale-[0.98] transition-all" id="btn-confirm-pairing" type="button">
      연결하기
    </button>
<!-- Secondary Cancel -->
<button class="w-full h-[52px] bg-surface-container text-on-surface font-label-lg text-label-lg rounded-xl flex items-center justify-center hover:bg-surface-container-high active:scale-[0.98] transition-all" onclick="history.back()" type="button">
      취소
    </button>
</div>
</div>
<script>
  (function() {
    const toggle = document.getElementById('toggle-day-one');
    const thumb = document.getElementById('toggle-thumb');
    const daysCount = document.getElementById('days-count');
    const confirmBtn = document.getElementById('btn-confirm-pairing');
    let isDayOne = true;

    if (toggle && thumb && daysCount) {
      toggle.addEventListener('click', function() {
        isDayOne = !isDayOne;
        toggle.setAttribute('aria-checked', isDayOne ? 'true' : 'false');
        
        if (isDayOne) {
          toggle.classList.remove('bg-surface-container-highest');
          toggle.classList.add('bg-primary-container');
          thumb.classList.remove('translate-x-0');
          thumb.classList.add('translate-x-5');
          daysCount.textContent = '510';
        } else {
          toggle.classList.remove('bg-primary-container');
          toggle.classList.add('bg-surface-container-highest');
          thumb.classList.remove('translate-x-5');
          thumb.classList.add('translate-x-0');
          daysCount.textContent = '509';
        }
      });
    }

    if (confirmBtn) {
      confirmBtn.addEventListener('click', function() {
        confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>';
        setTimeout(function() {
          confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] mr-1">check_circle</span> 연결 완료!';
          confirmBtn.classList.remove('bg-primary-container');
          confirmBtn.classList.add('bg-primary');
        }, 600);
      });
    }
  })();
</script></main></body></html>
