<script>
  // Simple micro-interactions for input mirror and toggles
  const titleInput = document.getElementById('dday-title');
  const previewTitle = document.getElementById('preview-title');
  if (titleInput && previewTitle) {
    titleInput.addEventListener('input', (e) => {
      previewTitle.textContent = e.target.value.trim() || '디데이 제목';
    });
  }

  // Toggle helpers
  function bindToggle(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', () => {
      const isChecked = el.getAttribute('aria-checked') === 'true';
      el.setAttribute('aria-checked', (!isChecked).toString());
      const thumb = el.querySelector('span');
      if (isChecked) {
        el.classList.remove('bg-primary-container');
        el.classList.add('bg-surface-container-highest');
        thumb.classList.remove('translate-x-5');
        thumb.classList.add('translate-x-0');
      } else {
        el.classList.add('bg-primary-container');
        el.classList.remove('bg-surface-container-highest');
        thumb.classList.add('translate-x-5');
        thumb.classList.remove('translate-x-0');
      }
    });
  }
  bindToggle('toggle-first-day');
  bindToggle('toggle-pin-home');

  // Segmented control toggle
  const tabDday = document.getElementById('tab-dday');
  const tabDplus = document.getElementById('tab-dplus');
  const firstDayContainer = document.getElementById('first-day-toggle-container');

  if (tabDday && tabDplus) {
    tabDday.addEventListener('click', () => {
      tabDday.className = 'flex-1 py-2.5 rounded-lg bg-surface-container-lowest text-on-surface font-label-lg text-label-lg shadow-sm font-semibold transition-all';
      tabDplus.className = 'flex-1 py-2.5 rounded-lg font-label-lg text-label-lg text-on-surface-variant transition-all';
      if (firstDayContainer) firstDayContainer.classList.add('hidden');
    });

    tabDplus.addEventListener('click', () => {
      tabDplus.className = 'flex-1 py-2.5 rounded-lg bg-surface-container-lowest text-on-surface font-label-lg text-label-lg shadow-sm font-semibold transition-all';
      tabDday.className = 'flex-1 py-2.5 rounded-lg font-label-lg text-label-lg text-on-surface-variant transition-all';
      if (firstDayContainer) firstDayContainer.classList.remove('hidden');
    });
  }
</script></main></body></html>
