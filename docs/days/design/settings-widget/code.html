    // Reset backgrounds
    photoBg.classList.add('opacity-0');
    pinkBg.classList.add('opacity-0');
    darkBg.classList.add('opacity-0');
    whiteBg.classList.add('opacity-0');

    // Update active theme & text contrast
    if (theme === 'photo') {
      photoBg.classList.remove('opacity-0');
      countText.className = 'font-display-hero-mobile text-display-hero-mobile font-extrabold text-white tracking-tighter drop-shadow-sm leading-none';
      subDesc.className = 'font-label-sm text-label-sm text-white/90 font-medium tracking-tight mt-1 line-clamp-1 drop-shadow-xs';
      catTag.className = 'flex items-center gap-1 px-2 py-0.5 rounded-full bg-white/20 backdrop-blur-md text-white shadow-xs';
    } else if (theme === 'pink') {
      pinkBg.classList.remove('opacity-0');
      countText.className = 'font-display-hero-mobile text-display-hero-mobile font-extrabold text-primary tracking-tighter leading-none';
      subDesc.className = 'font-label-sm text-label-sm text-on-surface-variant font-medium tracking-tight mt-1 line-clamp-1';
      catTag.className = 'flex items-center gap-1 px-2 py-0.5 rounded-full bg-white/70 backdrop-blur-md text-primary shadow-xs';
    } else if (theme === 'dark') {
      darkBg.classList.remove('opacity-0');
      countText.className = 'font-display-hero-mobile text-display-hero-mobile font-extrabold text-[#ffd9df] tracking-tighter leading-none';
      subDesc.className = 'font-label-sm text-label-sm text-[#dfbec3] font-medium tracking-tight mt-1 line-clamp-1';
      catTag.className = 'flex items-center gap-1 px-2 py-0.5 rounded-full bg-white/10 backdrop-blur-md text-[#ffd9df] shadow-xs';
    } else if (theme === 'white') {
      whiteBg.classList.remove('opacity-0');
      countText.className = 'font-display-hero-mobile text-display-hero-mobile font-extrabold text-primary tracking-tighter leading-none';
      subDesc.className = 'font-label-sm text-label-sm text-on-surface-variant font-medium tracking-tight mt-1 line-clamp-1';
      catTag.className = 'flex items-center gap-1 px-2 py-0.5 rounded-full bg-surface-container text-on-surface-variant shadow-xs';
    }

    // Update bottom selection state styles
    ['photo', 'pink', 'dark', 'white'].forEach(t => {
      const btn = document.getElementById(`themeBtn-${t}`);
      const label = btn.querySelector('span:last-child');
      const badge = btn.querySelector('.theme-check-badge');
      if (t === theme) {
        btn.classList.add('shadow-md');
        label.classList.remove('text-on-surface-variant', 'font-medium');
        label.classList.add('text-primary', 'font-bold');
        if (badge) {
          badge.classList.remove('hidden');
          badge.classList.add('flex');
        }
      } else {
        btn.classList.remove('shadow-md');
        label.classList.remove('text-primary', 'font-bold');
        label.classList.add('text-on-surface-variant', 'font-medium');
        if (badge) {
          badge.classList.remove('flex');
          badge.classList.add('hidden');
        }
      }
    });
  }

  function toggleAvatarSetting() {
    showAvatar = !showAvatar;
    const btn = document.getElementById('toggleAvatarBtn');
    const thumb = document.getElementById('toggleAvatarThumb');
    const avatarWrapper = document.getElementById('widgetAvatarWrapper');

    btn.setAttribute('aria-checked', showAvatar);
    if (showAvatar) {
      btn.classList.remove('bg-surface-container-highest');
      btn.classList.add('bg-primary');
      thumb.classList.remove('translate-x-0');
      thumb.classList.add('translate-x-5');
      avatarWrapper.style.opacity = '1';
      avatarWrapper.style.transform = 'scale(1)';
    } else {
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-surface-container-highest');
      thumb.classList.remove('translate-x-5');
      thumb.classList.add('translate-x-0');
      avatarWrapper.style.opacity = '0';
      avatarWrapper.style.transform = 'scale(0.7)';
    }
  }

  function toggleFormatSetting() {
    useStandardFormat = !useStandardFormat;
    const btn = document.getElementById('toggleFormatBtn');
    const thumb = document.getElementById('toggleFormatThumb');
    const countText = document.getElementById('widgetCountText');

    btn.setAttribute('aria-checked', useStandardFormat);
    if (useStandardFormat) {
      btn.classList.remove('bg-surface-container-highest');
      btn.classList.add('bg-primary');
      thumb.classList.remove('translate-x-0');
      thumb.classList.add('translate-x-5');
      countText.textContent = 'D+510';
    } else {
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-surface-container-highest');
      thumb.classList.remove('translate-x-5');
      thumb.classList.add('translate-x-0');
      countText.textContent = '510일';
    }
  }

  function selectWidgetSize(size) {
    currentSize = size;
    const card = document.getElementById('liveWidgetCard');
    const smallBtn = document.getElementById('sizeSmallBtn');
    const medBtn = document.getElementById('sizeMediumBtn');
    const lockBtn = document.getElementById('sizeLockBtn');

    // Style buttons
    [smallBtn, medBtn, lockBtn].forEach(b => {
      b.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
      b.classList.add('text-on-surface-variant');
    });

    if (size === 'small') {
      smallBtn.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
      smallBtn.classList.remove('text-on-surface-variant');
      card.style.width = '164px';
      card.style.height = '164px';
      card.style.borderRadius = '28px';
    } else if (size === 'medium') {
      medBtn.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
      medBtn.classList.remove('text-on-surface-variant');
      card.style.width = '240px';
      card.style.height = '120px';
      card.style.borderRadius = '24px';
    } else if (size === 'lock') {
      lockBtn.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
      lockBtn.classList.remove('text-on-surface-variant');
      card.style.width = '140px';
      card.style.height = '72px';
      card.style.borderRadius = '18px';
    }
  }

  function saveWidgetSettings() {
    const saveBtn = document.getElementById('saveWidgetBtn');
    const originalContent = saveBtn.innerHTML;
    saveBtn.innerHTML = `
      <span class="material-symbols-outlined text-[20px] animate-spin">sync</span>
      <span>저장 중...</span>
    `;
    saveBtn.disabled = true;

    setTimeout(() => {
      saveBtn.innerHTML = `
        <span class="material-symbols-outlined text-[20px]">check_circle</span>
        <span>설정이 저장되었습니다!</span>
      `;
      saveBtn.classList.remove('bg-primary');
      saveBtn.classList.add('bg-primary-container');

      setTimeout(() => {
        saveBtn.innerHTML = originalContent;
        saveBtn.disabled = false;
        saveBtn.classList.remove('bg-primary-container');
        saveBtn.classList.add('bg-primary');
      }, 1600);
    }, 600);
  }
</script></main></body></html>
