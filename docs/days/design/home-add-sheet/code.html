<!-- Drag Pull Bar -->

<div class="w-8 h-8 rounded-full bg-surface-container-lowest/60 flex items-center justify-center text-outline group-hover:text-primary group-hover:translate-x-0.5 transition-all flex-shrink-0">

</div>
</div>
<!-- Detail Context Text -->
<div class="mt-space-sm pt-space-xs w-full flex items-center space-x-1 text-outline">
<span class="material-symbols-outlined text-[15px] flex-shrink-0">event_repeat</span>
<p class="font-body-sm text-body-sm truncate">기념일, 사귄 날, 시험, 전역일 등 D-day와 D+day 카운트</p>
</div>
</button>

<button class="w-full group text-left bg-surface-container-low hover:bg-surface-container active:scale-[0.985] transition-all duration-150 rounded-2xl p-space-md shadow-sm relative overflow-hidden flex flex-col focus:outline-none" id="option-schedule" type="button">
<div class="flex items-start justify-between w-full">
<div class="flex items-center space-x-space-md min-w-0">

<div class="flex flex-col min-w-0">

<span class="font-headline-sm text-headline-sm text-on-surface font-bold">일정</span>

</div>
</button>
</div>
<!-- Quick Helpful Tip Bar -->

          닫기
        </button>

</div>

<script>
  (function() {
    const sheetContainer = document.getElementById('add-sheet-container');
    const backdropVeil = document.getElementById('backdrop-veil');
    const closeBtn = document.getElementById('close-sheet-btn');
    const cancelBtn = document.getElementById('cancel-sheet-btn');
    const optDday = document.getElementById('option-dday');
    const optSchedule = document.getElementById('option-schedule');

    function dismissSheet() {
      if (!sheetContainer) return;
      sheetContainer.style.opacity = '0';
      sheetContainer.style.pointerEvents = 'none';
      setTimeout(() => {
        sheetContainer.classList.add('hidden');
      }, 300);
    }

    if (backdropVeil) backdropVeil.addEventListener('click', dismissSheet);
    if (closeBtn) closeBtn.addEventListener('click', dismissSheet);
    if (cancelBtn) cancelBtn.addEventListener('click', dismissSheet);

    if (optDday) {
      optDday.addEventListener('click', () => {
        optDday.classList.add('ring-2', 'ring-primary');
        setTimeout(() => dismissSheet(), 180);
      });
    }

    if (optSchedule) {
      optSchedule.addEventListener('click', () => {
        optSchedule.classList.add('ring-2', 'ring-secondary');
        setTimeout(() => dismissSheet(), 180);
      });
    }
  })();
</script></main></body></html>
