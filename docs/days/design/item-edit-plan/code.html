<script>
  (function initAddPlanInteractions() {
    // Time chips toggle
    const timeChips = document.querySelectorAll('.time-chip');
    timeChips.forEach(chip => {
      chip.addEventListener('click', () => {
        timeChips.forEach(c => {
          c.classList.remove('bg-primary-container', 'text-on-primary', 'font-semibold', 'shadow-sm');
          c.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        chip.classList.add('bg-primary-container', 'text-on-primary', 'font-semibold', 'shadow-sm');
        chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
      });
    });

    // Notification chips toggle
    const notiChips = document.querySelectorAll('.noti-chip');
    notiChips.forEach(chip => {
      chip.addEventListener('click', () => {
        notiChips.forEach(c => {
          c.classList.remove('bg-primary-container', 'text-on-primary', 'font-semibold', 'shadow-sm');
          c.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        chip.classList.add('bg-primary-container', 'text-on-primary', 'font-semibold', 'shadow-sm');
        chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
      });
    });

    // Visibility Cards selection
    const sharedCard = document.getElementById('vis-shared');
    const privateCard = document.getElementById('vis-private');

    function setVisibility(selected) {
      if (selected === 'shared') {
        sharedCard.classList.remove('opacity-70');
        privateCard.classList.add('opacity-70');
        const iconWrap = sharedCard.querySelector('.w-5');
        iconWrap.classList.replace('bg-surface-container', 'bg-primary-container');
        iconWrap.classList.replace('text-transparent', 'text-on-primary');
        const privWrap = privateCard.querySelector('.w-5');
        privWrap.classList.replace('bg-primary-container', 'bg-surface-container');
        privWrap.classList.replace('text-on-primary', 'text-transparent');
      } else {
        privateCard.classList.remove('opacity-70');
        sharedCard.classList.add('opacity-70');
        const privWrap = privateCard.querySelector('.w-5');
        privWrap.classList.replace('bg-surface-container', 'bg-primary-container');
        privWrap.classList.replace('text-transparent', 'text-on-primary');
        const iconWrap = sharedCard.querySelector('.w-5');
        iconWrap.classList.replace('bg-primary-container', 'bg-surface-container');
        iconWrap.classList.replace('text-on-primary', 'text-transparent');
      }
    }

    if (sharedCard && privateCard) {
      sharedCard.addEventListener('click', () => setVisibility('shared'));
      privateCard.addEventListener('click', () => setVisibility('private'));
    }

    // Save CTA feedback
    const saveBtn = document.getElementById('save-plan-btn');
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        const titleInput = document.getElementById('event-title');
        const titleVal = titleInput ? titleInput.value.trim() : '일정';
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span> 저장 중...';
        setTimeout(() => {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span> 저장 완료!';
          setTimeout(() => {
            if (window.history.length > 1) {
              window.history.back();
            }
          }, 400);
        }, 500);
      });
    }
  })();
</script></main></body></html>
