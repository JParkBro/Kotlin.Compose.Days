</div>
<h2 class="font-headline-md text-headline-md text-on-surface">상대에게 이 코드를 보내주세요</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">상대방이 코드를 입력하면 둘만의 홈이 만들어져요</p>
</section>
<!-- Main Pairing Code Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-lg shadow-md mb-space-lg flex flex-col items-center">
<div class="w-full bg-surface-container-low rounded-xl py-space-xl px-space-md flex flex-col items-center justify-center relative overflow-hidden">

<span class="absolute top-2.5 right-3 text-primary/30 material-symbols-outlined text-[20px]">auto_awesome</span>
<span class="absolute bottom-2.5 left-3 text-primary/20 material-symbols-outlined text-[18px]">favorite</span>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase mb-space-xs">초대 인증 코드</span>
<!-- 6-character code -->
<div class="font-display-hero-mobile text-display-hero-mobile text-primary tracking-[0.25em] pl-[0.25em] my-space-xs font-extrabold select-all" id="pairing-code">
        K7Q 2MX
      </div>
<!-- Expiration Badge -->
<div class="mt-space-sm inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#FDF3E1] text-[#B45309]">
<span class="material-symbols-outlined text-[15px] animate-pulse">timer</span>
<span class="font-label-md text-label-md">23:41:05 후 만료</span>
</div>
</div>
<!-- Actions Area -->
<div class="w-full flex flex-col gap-space-sm mt-space-lg">
<!-- Kakao Share Button -->
<button class="w-full h-12 rounded-full bg-[#FEE500] text-[#191919] font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-sm" id="kakao-share-btn" type="button">
<svg aria-hidden="true" class="w-5 h-5 fill-current" viewbox="0 0 24 24">

</svg>
        카카오톡으로 공유

<button class="w-full h-12 rounded-full bg-surface-container text-on-surface font-label-lg text-label-lg flex items-center justify-center gap-1.5 active:scale-[0.98] transition-transform" id="copy-code-btn" type="button">
<span class="material-symbols-outlined text-[19px]">content_copy</span>

<div class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-sm mb-space-xl flex items-center gap-space-md">

<div class="w-20 h-20 bg-surface-container rounded-lg p-2 flex items-center justify-center shrink-0 shadow-inner">

<circle cx="5" cy="14" r="1"></circle>
</svg>

</div>

        카메라나 기본 스캐너로 비춰도 바로 연결돼요
      </p>
</div>

    </p>
</div>
<!-- Floating Toast Feedback for Micro-delight -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-5 py-2.5 rounded-full font-label-md text-label-md shadow-lg flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50" id="copy-toast">
<span class="material-symbols-outlined text-[18px] text-inverse-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span>연결 코드가 클립보드에 복사되었어요!</span>
</div>
</div>
<script>
  (function () {
    const copyBtn = document.getElementById('copy-code-btn');
    const toast = document.getElementById('copy-toast');
    const codeEl = document.getElementById('pairing-code');
    const kakaoBtn = document.getElementById('kakao-share-btn');

    function showToast() {
      if (!toast) return;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-[-8px]');
      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-[-8px]');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2400);
    }

    if (copyBtn && codeEl) {
      copyBtn.addEventListener('click', async () => {
        const text = codeEl.innerText.trim();
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          }
        } catch (_) {}
        showToast();
      });
    }

    if (kakaoBtn && codeEl) {
      kakaoBtn.addEventListener('click', () => {
        const text = codeEl.innerText.trim();
        if (navigator.share) {
          navigator.share({
            title: '두 사람의 날들 커플 연결',
            text: `[두 사람의 날들] 둘만의 홈으로 초대해요! 연결 코드: ${text}`,
          }).catch(() => {});
        } else {
          showToast();
        }
      });
    }
  })();
</script></main></body></html>
