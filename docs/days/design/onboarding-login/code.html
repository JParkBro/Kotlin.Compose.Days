<script>
  // Playful Micro-interaction: Tap squircle creates a tiny burst of hearts
  const heartIcon = document.getElementById('heart-squircle');
  if (heartIcon) {
    heartIcon.addEventListener('click', (e) => {
      const rect = heartIcon.getBoundingClientRect();
      for (let i = 0; i < 4; i++) {
        const floater = document.createElement('span');
        floater.className = 'material-symbols-outlined fixed text-primary pointer-events-none transition-all duration-700 ease-out select-none';
        floater.style.fontVariationSettings = "'FILL' 1";
        floater.style.fontSize = `${16 + Math.random() * 12}px`;
        floater.style.left = `${rect.left + rect.width / 2}px`;
        floater.style.top = `${rect.top + rect.height / 2}px`;
        floater.style.zIndex = '99';
        floater.textContent = 'favorite';
        document.body.appendChild(floater);

        const offsetX = (Math.random() - 0.5) * 80;
        const offsetY = -40 - Math.random() * 50;
        
        requestAnimationFrame(() => {
          floater.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(1.3)`;
          floater.style.opacity = '0';
        });

        setTimeout(() => floater.remove(), 750);
      }
    });
  }

  function triggerLoginFeedback(provider) {
    // Soft haptic simulated ripple effect on action
    const btn = event.currentTarget;
    btn.classList.add('opacity-80');
    setTimeout(() => {
      btn.classList.remove('opacity-80');
    }, 180);
  }
