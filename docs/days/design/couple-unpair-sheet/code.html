<!DOCTYPE html>

<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:transparent;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "error": "#ba1a1a", "on-secondary-fixed-variant": "#7a2f16", "on-tertiary-fixed-variant": "#8b103f", "secondary-fixed-dim": "#ffb59e", "primary-container": "#d23c69", "inverse-surface": "#372e32", "tertiary-fixed-dim": "#ffb1c1", "primary-fixed": "#ffd9df", "surface": "#fff8f8", "surface-dim": "#e5d6dc", "on-surface": "#21191d", "error-container": "#ffdad6", "on-tertiary-fixed": "#3f0017", "on-background": "#21191d", "secondary-fixed": "#ffdbd0", "secondary-container": "#fd9573", "on-primary-fixed-variant": "#90003c", "primary": "#b02051", "primary-fixed-dim": "#ffb1c0", "surface-tint": "#b22252", "on-surface-variant": "#584145", "inverse-primary": "#ffb1c0", "surface-variant": "#eedfe4", "outline": "#8c7074", "surface-container-highest": "#eedfe4", "on-error-container": "#93000a", "outline-variant": "#dfbec3", "surface-container-low": "#fff0f5", "surface-bright": "#fff8f8", "inverse-on-surface": "#fdedf2", "on-tertiary-container": "#ffffff", "tertiary-container": "#cb456d", "on-primary-container": "#fffeff", "on-error": "#ffffff", "on-primary": "#ffffff", "on-secondary-fixed": "#3a0b00", "on-tertiary": "#ffffff", "background": "#fff8f8", "on-secondary": "#ffffff", "on-secondary-container": "#752c13", "surface-container": "#faeaef", "surface-container-lowest": "#ffffff", "on-primary-fixed": "#3f0016", "secondary": "#98462a", "tertiary-fixed": "#ffd9df", "tertiary": "#aa2b55", "surface-container-high": "#f4e4ea" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1.25rem", "gutter": "1rem", "space-2xl": "2.5rem", "gutter-compact": "0.75rem", "space-lg": "1.25rem", "space-xl": "1.75rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "0.875rem", "margin-mobile": "1rem" }, fontFamily: { "body-md": ["Plus Jakarta Sans"], "metric-tabular": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "display-hero-mobile": ["Plus Jakarta Sans"], "display-hero": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"] }, fontSize: { "body-md": ["15px", {"lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400"}], "metric-tabular": ["24px", {"lineHeight": "28px", "letterSpacing": "-0.02em", "fontWeight": "700"}], "label-sm": ["11px", {"lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600"}], "body-sm": ["13px", {"lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400"}], "display-hero-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800"}], "display-hero": ["44px", {"lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "800"}], "body-lg": ["17px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "400"}], "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700"}], "headline-md": ["22px", {"lineHeight": "30px", "letterSpacing": "-0.015em", "fontWeight": "700"}], "label-lg": ["15px", {"lineHeight": "20px", "letterSpacing": "-0.005em", "fontWeight": "600"}], "headline-sm": ["18px", {"lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600"}], "label-md": ["13px", {"lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "600"}] } } } }</script><style>body { min-height: max(884px, 100dvh); }</style><style>
    body {
      min-height: max(884px, 100dvh);

  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen relative overflow-x-hidden"><main class="flex flex-col relative w-full min-h-screen justify-end bg-inverse-surface/40 backdrop-blur-sm"><div class="flex flex-col w-full">
<div class="w-full bg-surface-container-lowest rounded-t-[28px] shadow-2xl px-5 pt-3.5 pb-8 flex flex-col transition-all duration-300">
<!-- Grab Handle -->
<div class="w-10 h-1 bg-outline-variant/60 rounded-full mx-auto mb-4"></div>
<!-- Header Section: Icon & Question -->
<div class="flex flex-col items-center text-center">
<div class="w-12 h-12 rounded-full bg-error-container/60 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-error text-[26px]" style="font-variation-settings: 'FILL' 1;">heart_broken</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">
        지민 님과 연결을 해제할까요?
      </h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
        공유 디데이와 일정은 각자에게 사본으로 남아요
      </p>
</div>
<!-- Safeguard Info Card -->
<div class="bg-surface-container rounded-xl p-3.5 my-3.5 flex items-start gap-3">
<div class="w-7 h-7 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-primary text-[17px]">history</span>
</div>
<div class="flex flex-col min-w-0">
<p class="font-label-md text-label-md text-on-surface">
          30일 안에 다시 연결하면 복구돼요
        </p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
          30일 보관 기간 동안은 언제든 기존 코드로 바로 복구할 수 있습니다.
        </p>
</div>
</div>
<!-- Additional Data Deletion Checkbox Option -->
<div class="bg-surface-container-low rounded-xl p-3.5 mb-2.5 transition-colors" id="purge-option-container">
<label class="flex items-start gap-3 cursor-pointer select-none" for="purge-data-toggle">
<div class="relative flex items-center justify-center shrink-0 mt-0.5">
<input class="peer sr-only" id="purge-data-toggle" onchange="togglePurgeStyle(this.checked)" type="checkbox"/>
<div class="w-5 h-5 rounded-md bg-surface-container-highest transition-all flex items-center justify-center peer-checked:bg-error">
<span class="material-symbols-outlined text-on-error text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface">
            공유 항목 사본도 삭제하기
          </span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">
            체크하면 내 보관함에서도 지민 님과 공유했던 디데이가 모두 지워집니다.
          </span>
</div>
</label>
</div>
<!-- Informative Notice -->
<div class="flex items-center justify-center gap-1.5 my-2">
<span class="material-symbols-outlined text-on-surface-variant text-[15px]">notifications_none</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">
        상대에게 연결 해제 알림이 가요
      </p>
</div>
<!-- Action Buttons Stack -->
<div class="flex flex-col gap-2 mt-1">
<button class="w-full h-12 rounded-full bg-error active:opacity-90 flex items-center justify-center gap-1.5 transition-transform active:scale-[0.98] shadow-sm" id="disconnect-action-btn" onclick="handleDisconnectConfirm()" type="button">
<span class="material-symbols-outlined text-on-error text-[19px]">link_off</span>
<span class="font-label-lg text-label-lg text-on-error">연결 해제</span>
</button>
<button class="w-full h-11 rounded-full bg-surface-container active:bg-surface-container-high flex items-center justify-center transition-all active:scale-[0.98]" onclick="dismissSheet()" type="button">
<span class="font-label-lg text-label-lg text-on-surface">취소</span>
</button>
</div>
</div>
</div>
<script>
  function togglePurgeStyle(isChecked) {
    const container = document.getElementById('purge-option-container');
    if (isChecked) {
      container.classList.remove('bg-surface-container-low');
      container.classList.add('bg-error-container/40');
    } else {
      container.classList.add('bg-surface-container-low');
      container.classList.remove('bg-error-container/40');
    }
  }

  function handleDisconnectConfirm() {
    const isPurgeChecked = document.getElementById('purge-data-toggle').checked;
    const btn = document.getElementById('disconnect-action-btn');
    btn.innerHTML = '<span class="material-symbols-outlined text-on-error animate-spin text-[19px]">progress_activity</span><span class="font-label-lg text-label-lg text-on-error">처리 중...</span>';
    btn.disabled = true;

    setTimeout(() => {
      dismissSheet();
    }, 600);
  }

  function dismissSheet() {
    const sheet = document.querySelector('.w-full.bg-surface-container-lowest');
    if (sheet) {
      sheet.classList.add('translate-y-full', 'opacity-0');
    }
  }
</script></main></body></html>
