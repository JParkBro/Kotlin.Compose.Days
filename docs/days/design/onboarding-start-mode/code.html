</div>

<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>

<script>
  function selectOption(mode) {
    const soloCard = document.getElementById('option-solo');
    const coupleCard = document.getElementById('option-couple');
    const checkSolo = document.getElementById('check-solo');
    const checkCouple = document.getElementById('check-couple');

    if (mode === 'solo') {
      soloCard.setAttribute('aria-checked', 'true');
      soloCard.className = 'group relative flex items-start gap-space-md p-space-lg rounded-xl bg-surface-container-low shadow-md cursor-pointer select-none transition-all active:scale-[0.99]';
      checkSolo.className = 'flex-shrink-0 w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm transition-colors';
      checkSolo.querySelector('span').classList.remove('opacity-0');
      checkSolo.querySelector('span').classList.add('text-on-primary');

      coupleCard.setAttribute('aria-checked', 'false');
      coupleCard.className = 'group relative flex items-start gap-space-md p-space-lg rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer select-none transition-all active:scale-[0.99]';
      checkCouple.className = 'flex-shrink-0 w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center transition-colors';
      checkCouple.querySelector('span').classList.add('opacity-0');
    } else {
      coupleCard.setAttribute('aria-checked', 'true');
      coupleCard.className = 'group relative flex items-start gap-space-md p-space-lg rounded-xl bg-surface-container-low shadow-md cursor-pointer select-none transition-all active:scale-[0.99]';
      checkCouple.className = 'flex-shrink-0 w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm transition-colors';
      checkCouple.querySelector('span').classList.remove('opacity-0');
      checkCouple.querySelector('span').classList.add('text-on-primary');

      soloCard.setAttribute('aria-checked', 'false');
      soloCard.className = 'group relative flex items-start gap-space-md p-space-lg rounded-xl bg-surface-container-lowest shadow-sm cursor-pointer select-none transition-all active:scale-[0.99]';
      checkSolo.className = 'flex-shrink-0 w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center transition-colors';
      checkSolo.querySelector('span').classList.add('opacity-0');
    }
  }
</script></main></body></html>
